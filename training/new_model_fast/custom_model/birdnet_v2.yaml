# BirdNet v2 - memory-lean redesign (DRAFT - build-check on VM pending).
#
# Design currency: ACTIVATION BYTES, not FLOPs. Board measurements
# (PROGRESS 2026-11-16): 40% fewer FLOPs bought only ~13% float speed,
# while INT8 (2x fewer bytes+MACs) bought ~2.2x. So v2 cuts where the
# bytes are:
#   * stem: 448->112 in ONE stride-4 conv (24ch) instead of two stride-2
#     convs + a 2-rep C2f at 112x112 (v1's biggest traffic block).
#   * every stage C2f: 2 reps -> 1 rep (hidden-expand output still rides
#     the bottleneck).
#   * channels: P3 64->48, P4 96->72, P5 128->96; neck outputs follow.
#   * neck: same PAN shape (3 levels, strides 8/16/32 -> N=4116 @448),
#     but all neck C2f 1 rep -> kills the 192ch@112^2 concat aftermath.
#   * head stays BirdDetect box 32 / cls 32 (head output is tiny).
#
# Expected: ~0.65M params, activation traffic ~45% of v1.
# Float fwd on AM62 maybe ~450-500 ms, INT8 maybe ~180-250 ms (guesses -
# measure). Accuracy plan: from-scratch + distill from the 0.806 teacher
# (same pipeline as birdnet_d1); scratch accuracy will be below v1, that
# is what the teacher is for.
#
# ReLU-only, stock ultralytics names, register() monkey-patches them.
# Export stays stock -> ONNX (1, 5, N) = cpp/birdcpp.c contract.

nc: 1
depth_multiple: 1.0
width_multiple: 1.0
max_channels: 512

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [24, 3, 4]]   # 0  stem stride-4: 448->112x112
  - [-1, 1, C2f, [32, True]]    # 1  P2-lite @112 (1 rep)
  - [-1, 1, Conv, [48, 3, 2]]   # 2  P3/8
  - [-1, 2, C2f, [48, True]]    # 3  -> P3 out (detect level 0)
  - [-1, 1, Conv, [72, 3, 2]]   # 4  P4/16
  - [-1, 1, C2f, [72, True]]    # 5
  - [-1, 1, Conv, [96, 3, 2]]   # 6  P5/32
  - [-1, 1, SPPF, [96, 5]]      # 7

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 8
  - [[-1, 5], 1, Concat, [1]]                   # 9  cat P4 (72+96=168)
  - [-1, 1, C2f, [72]]                          # 10
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 3], 1, Concat, [1]]                   # 12 cat P3 (48+72=120)
  - [-1, 1, C2f, [48]]                          # 13 -> P3/8 out (small)
  - [-1, 1, Conv, [48, 3, 2]]                   # 14
  - [[-1, 10], 1, Concat, [1]]                  # 15 cat (48+72=120)
  - [-1, 1, C2f, [72]]                          # 16 -> P4/16 out (medium)
  - [-1, 1, Conv, [72, 3, 2]]                   # 17
  - [[-1, 7], 1, Concat, [1]]                   # 18 cat (72+96=168)
  - [-1, 1, C2f, [96]]                          # 19 -> P5/32 out (large)
  - [[13, 16, 19], 1, Detect, [nc]]             # 20 -> BirdDetect
